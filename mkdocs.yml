site_name: TilekarOS Documentation
site_description: A 32-bit x86 Hobby Operating System
site_author: TilekarOS Team
repo_url: https://github.com/your-username/TilekarOS

theme:
  name: material
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html

extra_javascript:
  - javascripts/katex.js
  - https://unpkg.com/katex@0/dist/katex.min.js
  - https://unpkg.com/katex@0/dist/contrib/auto-render.min.js

extra_css:
  - https://unpkg.com/katex@0/dist/katex.min.css

nav:
  - Home: README.md
  - Getting Started:
      - Build System: getting-started/build-system.md
      - Installation Guide: getting-started/installation.md
      - Experimenting & Messing Around: getting-started/experimenting.md
  - Kernel Internals:
      - Architecture Overview: kernel/architecture.md
      - Kernel Initialization: kernel/kernel-init.md
      - GDT & TSS: kernel/gdt.md
      - Memory Management: kernel/memory-management.md
      - Interrupts & Exceptions: kernel/interrupts.md
      - Multitasking: kernel/multitasking.md
      - Task Management Guide: kernel/tasks-guide.md
      - ELF Executables Guide: kernel/elf-guide.md
      - System Call Dispatcher: kernel/syscalls.md
      - Kernel Utilities: kernel/kernel-utilities.md
  - Drivers:
      - VGA/TTY: drivers/vga-tty.md
      - Keyboard: drivers/keyboard.md
      - Timer: drivers/timer.md
  - API Reference:
      - System Call Reference: api/syscall-reference.md
      - LibC Reference: api/libc-reference.md
  - Development & Contributions:
      - Coding Style: development/coding-style.md
      - Documentation Guide: development/documentation-guide.md
